workflows:
  casino-gpt-ci:
    name: CasinoGPT CI
    instance_type: linux
    max_build_duration: 20
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: develop
          include: true
          source: true
    environment:
      node: 20
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install workspace dependencies
        script: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build project
        script: |
          npm run build --if-present

      - name: Run tests
        script: |
          npm test --if-present

      - name: Validate Docker Compose configuration
        script: |
          if [ -f docker-compose.yml ]; then
            docker compose -f docker-compose.yml config --quiet
          else
            echo "No docker-compose.yml found; skipping Compose validation."
          fi

      - name: Build Docker services
        script: |
          if [ -f docker-compose.yml ]; then
            docker compose -f docker-compose.yml build
          else
            echo "No docker-compose.yml found; skipping Docker build."
          fi

    artifacts:
      - build/**
      - dist/**
      - coverage/**

    publishing:
      email:
        recipients:
          - allenlaw65@gmail.com
        notify:
          success: true
          failure: true
