workflows:
  casino-gpt-ci:
    name: CasinoGPT CI
    instance_type: linux
    max_build_duration: 20
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: develop
          include: true
          source: true
    environment:
      node: 20
      groups:
        - vercel_credentials
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install workspace dependencies
        script: |
          npm install

      - name: Build project
        script: |
          npm run build --if-present

      - name: Run tests
        script: |
          npm test --if-present

      - name: Optional Vercel deploy
        script: |
          if [ -n "$VERCEL_TOKEN" ]; then
            npx vercel deploy --prod --token "$VERCEL_TOKEN" --yes
          else
            echo "VERCEL_TOKEN not set; skipping Vercel deploy."
          fi

      - name: Optional Docker build
        script: |
          if [ -f Dockerfile ]; then
            docker build -t casinogpt:${CM_BUILD_ID} .
          else
            echo "No Dockerfile found; skipping Docker build."
          fi

    publishing:
      email:
        recipients:
          - allenlaw65.boop@example.com
        notify:
          success: true
          failure: true
      slack:
        channel: "#casinogpt-builds"
        notify_on_build_start: true
        notify:
          success: true
          failure: true
