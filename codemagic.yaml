workflows:
  casino-gpt-android:
    name: CasinoGPT Android Build
    instance_type: linux
    max_build_duration: 60
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: develop
          include: true
          source: true
        - pattern: Ughh
          include: true
          source: true
    environment:
      node: 20
      java: 17
      groups:
        - expo_credentials
      vars:
        NODE_ENV: production
        EXPO_TOKEN: $EXPO_TOKEN
        EAS_BUILD_PROFILE: production
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install dependencies
        script: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Expo/EAS tooling
        script: |
          npm install -g eas-cli

      - name: Validate Expo app
        script: |
          cd apps/mobile
          npx expo doctor

      - name: Type check the app
        script: |
          npm --workspace apps/mobile run type-check

      - name: Lint the app
        script: |
          npm --workspace apps/mobile run lint -- --max-warnings=0

      - name: Run tests
        script: |
          npm --workspace apps/mobile run test -- --passWithNoTests

      - name: Build Android app with EAS
        script: |
          cd apps/mobile
          eas build --platform android --profile production --non-interactive --wait
    artifacts:
      - apps/mobile/**/*.apk
      - apps/mobile/**/*.aab
      - apps/mobile/**/build-output.json
    publishing:
      email:
        recipients:
          - allenlaw65@gmail.com
        notify:
          success: true
          failure: true
