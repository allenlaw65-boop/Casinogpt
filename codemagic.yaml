workflows:
  casino-gpt-node-docker:
    name: CasinoGPT Node + Docker CI
    instance_type: linux
    max_build_duration: 30
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: develop
          include: true
          source: true
        - pattern: Ughh
          include: true
          source: true
    environment:
      node: 20
      vars:
        NODE_ENV: production
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install workspace dependencies
        script: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build workspace packages
        script: |
          npm run build --if-present

      - name: Run tests
        script: |
          npm test --if-present

      - name: Validate Docker Compose file
        script: |
          docker compose -f docker-compose.yml config

      - name: Build Docker services
        script: |
          docker compose -f docker-compose.yml build
    artifacts:
      - build/**
      - dist/**
      - coverage/**

  casino-gpt-android:
    name: CasinoGPT Android Release
    instance_type: linux
    max_build_duration: 45
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: develop
          include: true
          source: true
        - pattern: Ughh
          include: true
          source: true
    environment:
      java: 17
      android_signing:
        - casino_gpt_keystore
      vars:
        PACKAGE_NAME: com.casinogpt.app
    scripts:
      - name: Accept Android SDK licenses
        script: |
          yes | sdkmanager --licenses || true

      - name: Build Android release APK/AAB
        script: |
          cd apps/android
          ./gradlew assembleRelease
    artifacts:
      - apps/android/app/build/outputs/**/*.apk
      - apps/android/app/build/outputs/**/*.aab

  casino-gpt-ios:
    name: CasinoGPT iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: develop
          include: true
          source: true
        - pattern: Ughh
          include: true
          source: true
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.casinogpt.app
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: CasinoGPT.xcworkspace
        XCODE_SCHEME: CasinoGPT
    scripts:
      - name: Install CocoaPods dependencies
        script: |
          cd apps/ios
          pod install

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Build iOS release archive
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - apps/ios/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
